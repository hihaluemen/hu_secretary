name: mishu-demo

services:
  mysql:
    profiles: ["with-mysql"]
    image: ${DOCKER_REGISTRY:-}mysql:8.0
    container_name: mishu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DB}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        HTTP_PROXY: ${BACKEND_HTTP_PROXY:-${HTTP_PROXY:-}}
        HTTPS_PROXY: ${BACKEND_HTTPS_PROXY:-${HTTPS_PROXY:-}}
        NO_PROXY: ${BACKEND_NO_PROXY:-${NO_PROXY:-localhost,127.0.0.1,backend,mysql,host.docker.internal}}
    image: mishu-backend:local
    container_name: mishu-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DB: ${MYSQL_DB:-daily_assistant}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      MYSQL_WAIT_TIMEOUT: 120
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${HTTP_PORT:-8655},https://localhost:${HTTPS_PORT:-8656}}
      HTTP_PROXY: ${BACKEND_HTTP_PROXY:-${HTTP_PROXY:-}}
      HTTPS_PROXY: ${BACKEND_HTTPS_PROXY:-${HTTPS_PROXY:-}}
      NO_PROXY: ${BACKEND_NO_PROXY:-${NO_PROXY:-localhost,127.0.0.1,backend,mysql,host.docker.internal}}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        USE_CN_MIRROR: ${USE_CN_MIRROR:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-120000}
        HTTP_PROXY: ${FRONTEND_HTTP_PROXY:-}
        HTTPS_PROXY: ${FRONTEND_HTTPS_PROXY:-}
        NO_PROXY: ${FRONTEND_NO_PROXY:-localhost,127.0.0.1,backend,mysql,host.docker.internal}
    image: mishu-frontend:local
    container_name: mishu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8655}:80"
      - "${HTTPS_PORT:-8656}:443"

volumes:
  mysql-data:
